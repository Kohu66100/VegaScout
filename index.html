<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ベガスカウト</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    max-width:900px;
    margin:auto;
    padding:20px;
}

#choices button{
    display:block;
    width:300px;
    margin:10px auto;
    padding:12px;
    font-size:18px;
    cursor:pointer;
}

#startButton,
#copyButton{
    padding:12px 24px;
    font-size:18px;
    cursor:pointer;
}

#username{
    padding:10px 20px;
    font-size:18px;
}

#selectedList{
    margin:20px auto;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    max-width:400px;
    min-height:80px;
    text-align:left;
    display:none;
}

button:hover {
    transform: scale(1.02);
}

#result{
    margin-top:20px;
}

#description{
    margin-top:60px;
    padding:20px;
    border-top:1px solid #ccc;
    text-align:left;
}
</style>
</head>
<body>

<h1>ベガスカウト ver0.1</h1>

<div id="startArea">
    <input type="text" id="username" placeholder="名前を入力">
    <button id="startButton">はじめる</button>
</div>

<p id="seed"></p>

<p id="round"></p>

<div id="choices"></div>

<div id="selectedList"></div>
<div id="result"></div>

<div id="candidateArea">
    <label>
        一度に提示する候補数
    </label>
    <select id="candidateCount">
        <option value="3">3種類</option>
        <option value="4">4種類</option>
        <option value="5" selected>5種類</option>
        <option value="6">6種類</option>
        <option value="7">7種類</option>
        <option value="8">8種類</option>
        <option value="9">9種類</option>
        <option value="10">10種類</option>
    </select>
</div>

<div id="description">
    <h2>説明</h2>

    <p>
        ベガのポケモンがランダムに提示されます。
    </p>

    <p>
        6回選択してスカウトチームを作成しましょう。
    </p>

    <br>

    <p>
        キャラ総数192種類
    </p>

    <p>
        出現候補：最終進化/600族/準伝説/幻
    </p>

    <p>
        対象外：禁止伝説/ジバクン/アンノーン/ラクチャン
    </p>

    <br>

    <p>
        名前と日付によって抽選内容が固定されます。
    </p>
</div>

<script>

const characters = [
"リーテイル","ファマイン","タテボーシ","オオスバメ","ルカリオ","ヘルガー","ダグトリオ","トゲキッス","フローリア","ライチュウ","ゴリチュウ","エアームド","ニドクイン","ニドキング","フローゼル","セラーナ","フォレトス","パルシェン","ペガーン","ユニサス","サワムラー","エビワラー","カポエラー","メタゲラス","ディザソル","フォリキー","ファントマ","ジバコイル","スターミー","ゲンガー","ナッシー","ググズリー","ハンタマ","ドサイドン","トロピウス","ポリゴンZ","トドゼルガ","マルマジロ","リーフィス","ユキノオー","ネクロシア","バフォット","ミルタンク","ツボツボ","フィニクス","コクジャク","コーシャン","ボルトック","テペトラー","ロップル","ニートン","ヨルノズク","ハクタクン","エレキブル","ブーバーン","ガルーラ","ユレイドル","マカドゥス","プテラ","バンギラス","メタグロス","ガブリアス","ドラドーン","フリーザー","サンダー","ファイヤー","ライコウ","エンテイ","スイクン","ライラプス","ガニメデ","ネメア","ダークライ","ミュウ","フシギバナ","リザードン","カメックス","バジリール","コマレオン","バクソウオ","チェキッド","チェキラス","ララミンゴ","パチリック","パンプッチ","ルナバイン","ウソドロ","メタモン","レジュリア","ポコキング","アスイーツ","ユキタテハ","オオペラー","オリバー","ランペルン","キーボン","レディバル","ケンタロス","プラネム","コモラゴン","オクタン","ヤミクラゲ","オオイナリ","ホムロソク","ガレキダマ","ワラガシラ","ドルマイン","ドンカラス","バクオング","キングラー","スモーガス","カモドック","トノッパー","ガルラーダ","ハサーガ","アメリシア","カンカーン","テイルーン","モグルトン","マニューラ","キノガッサ","ドゴン","トコヤミ","クチールス","ハッサム","ガッツロス","アーボスク","モアドガス","ヨノワール","ベロベルト","アリアドス","デンチュラ","ベタデーム","ダンカンス","ヒササビ","ドサーモン","テッコンボ","ボンバット","ハピナス","テッカニン","ヌケニン","サンドリル","ビビッドン","オールガ","ヒョウカク","サーナイト","エルレイド","シルドール","セルディー","バーネッコ","ヒカリゴケ","フリージオ","ワークロ","アリンセス","ゴローニャ","ドラピオン","オンネット","マンムー","マッギョ","パッチール","アルデッパ","カミギリー","ガネーシャ","ギギギアル","ラブリン","ラプラス","サムラダケ","ノクタス","プテリクス","ティラノス","ブレイドン","ブレイオー","テルテン","イワパレス","ナットレイ","シビルドン","プレゼンタ","ストータス","ノコウテイ","カモナイツ","ズルズキン","ドレディア","コジョンド","ワルビアル","ロイツァー","ガタノア","ヒードラン","ラティアス","ラティオス","フィオネ","マナフィ","オルディナ"
];

const badCharacters = [
"ジバクン","アンノーン","ラクチャン"
];

let remainingCharacters = [];
let selectedCharacters = [];
let round = 1;
let candidateCount = 5;

function shuffle(array){
    const arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}

function startGame(){

    remainingCharacters = [...characters];
    selectedCharacters = [];
    round = 1;

    candidateCount =
        Number(
            document.getElementById(
                "candidateCount"
            ).value
        );

    document.getElementById("startArea").style.display = "none";
    document.getElementById("candidateArea").style.display = "none";
    document.getElementById("selectedList").style.display = "block";

    updateSelectedList();
    showChoices();
}

function showChoices(){

    let name =
        document.getElementById("username").value;

    if(name === ""){
        name = "ベガ";
    }

    const today =
        new Date().toISOString().slice(0,10);

    let seed =
        stringToSeed(name + today);

    let chars = remainingCharacters;

    for(let i = chars.length - 1; i > 0; i--) {

        const rand = seededRandom(seed);

        seed = rand.seed;

        const j =
            Math.floor(rand.value * (i + 1));

        [chars[i], chars[j]] =
        [chars[j], chars[i]];
    }

    document.getElementById("seed").textContent =
        `名前：${name} 日付：${today}`;

    document.getElementById("round").textContent =
        `${round}/ 6回目`;

    const candidates =
        chars.slice(0, candidateCount);

    const choicesDiv =
        document.getElementById("choices");

    choicesDiv.innerHTML = "";

    candidates.forEach(character => {

        const button =
            document.createElement("button");

        button.textContent = character;

        button.onclick = () =>
            selectCharacter(character);

        choicesDiv.appendChild(button);
    });
}

function selectCharacter(character){

    selectedCharacters.push(character);

    remainingCharacters =
        remainingCharacters.filter(
            c => c !== character
        );

    updateSelectedList();

    if(round >= 6){
        showResult();
        return;
    }

    round++;
    showChoices();
}

function showResult(){

    document.getElementById("choices").innerHTML = "";
    document.getElementById("round").textContent =
        "選択完了";

    const resultText =
        selectedCharacters.join("\n");

    document.getElementById("result").innerHTML = `

        <button id="copyButton">
            結果をコピー
        </button>
    `;

    document
        .getElementById("copyButton")
        .onclick = copyResult;
}

function copyResult(){

    const text =
        selectedCharacters.join("\n");

    navigator.clipboard
        .writeText(text)
        .then(() => {
            alert("コピーしました");
        });
}

function updateSelectedList(){

    const selectedList =
        document.getElementById("selectedList");

    if(selectedCharacters.length === 0){
        selectedList.textContent =
            "";
        return;
    }

    selectedList.innerHTML =
        selectedCharacters
        .map((char,index) =>
            `${index + 1}. ${char}`
        )
        .join("<br>");
}

function stringToSeed(str) {

    let seed = 0;

    for(let i = 0; i < str.length; i++) {
        seed =
            (seed * 31 + str.charCodeAt(i))
            >>> 0;
    }

    return seed;
}

function seededRandom(seed) {

    seed =
        (seed * 1664525 + 1013904223)
        % 4294967296;

    return {
        value: seed / 4294967296,
        seed: seed
    };
}

document
    .getElementById("startButton")
    .addEventListener("click", startGame);

</script>

</body>
</html>
